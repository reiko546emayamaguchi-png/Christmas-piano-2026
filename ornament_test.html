<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オーナメント56個 テスト</title><style>body{margin:0;background:#fff8ed;color:#563327;font-family:system-ui,sans-serif;text-align:center}main{max-width:760px;margin:auto;padding:20px}h1{font-size:25px}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{background:#9b2531;color:white;border:0;border-radius:12px;padding:13px 17px;font-size:17px;cursor:pointer}button:active{opacity:.7}#tree{position:relative;width:min(94vw,520px);height:600px;margin:16px auto 0}.foliage{position:absolute;inset:30px 0 15px;background:linear-gradient(120deg,#236b45,#114a34 55%,#28764b);clip-path:polygon(50% 0,65% 21%,59% 21%,77% 42%,68% 42%,88% 66%,76% 66%,98% 91%,2% 91%,24% 66%,12% 66%,32% 42%,23% 42%,41% 21%,35% 21%);filter:drop-shadow(0 5px 3px #bbb)}.trunk{position:absolute;bottom:0;left:45%;width:10%;height:80px;background:#80502b}.orn{position:absolute;z-index:2;transform:translate(-50%,-50%);font-family:'Times New Roman',serif;font-weight:bold;font-size:30px;text-shadow:0 2px 2px #1c3926}.gold{color:#e6b947}.red{color:#ee3844}.white{color:#fffdf1}.glow{text-shadow:0 0 6px currentColor,0 0 16px currentColor,0 0 23px currentColor}.blink{animation:blink 1.5s ease-in-out infinite alternate}@keyframes blink{from{text-shadow:0 1px 2px #203c2a;opacity:.7}to{text-shadow:0 0 9px currentColor,0 0 22px currentColor,0 0 30px currentColor;opacity:1}}.star{position:absolute;z-index:3;top:0;left:50%;transform:translateX(-50%);font-size:52px;color:#f8d453;text-shadow:0 0 12px #ffc85c}.status{font-size:20px;font-weight:bold}small{display:block;line-height:1.7;margin:12px}</style></head><body><main><h1>🎄 オーナメント56個 テスト</h1><p>5回練習で1個・1日最大1個（この画面は表示テスト専用）</p><div class="controls"><button id="plus">＋ 1個</button><button id="seven">＋ 7個</button><button id="all">56個表示</button><button id="reset">0個に戻す</button></div><p class="status" id="status">0 / 56 個</p><div id="tree"><div class="trunk"></div><div class="foliage"></div><div id="items"></div><div class="star" id="star" hidden>★</div></div><small>記号の順番：ト音記号 → 8分音符 → シャープ → 連桁16分音符 → フラット → 4分音符 → ヘ音記号 → 連桁8分音符<br>色：光らない金・光らない赤・光る白・光る金・光る赤・点滅金・点滅赤。実際の生徒の記録には影響しません。</small></main><script>const symbols=['𝄞','♪','♯','♬','♭','♩','𝄢','♫'];const variants=[['gold',''],['red',''],['white','glow'],['gold','glow'],['red','glow'],['gold','blink'],['red','blink']];let count=0;const items=document.getElementById('items');function draw(){items.innerHTML='';for(let i=0;i<count;i++){const row=Math.floor(i/8),col=i%8;const y=25+row*8.8;const half=8+row*4.5;const x=50+(col-3.5)*half/3.5;const [color,effect]=variants[Math.floor(i/8)];const span=document.createElement('span');span.className='orn '+color+' '+effect;span.textContent=symbols[i%8];span.style.left=x+'%';span.style.top=y+'%';items.appendChild(span)}document.getElementById('star').hidden=count!==56;document.getElementById('status').textContent=count+' / 56 個'}document.getElementById('plus').onclick=()=>{count=Math.min(56,count+1);draw()};document.getElementById('seven').onclick=()=>{count=Math.min(56,count+7);draw()};document.getElementById('all').onclick=()=>{count=56;draw()};document.getElementById('reset').onclick=()=>{count=0;draw()};draw();</script></body></html>
